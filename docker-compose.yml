services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: valo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: valo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valo"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      VALO_DATABASE_URL: postgresql+asyncpg://valo:${POSTGRES_PASSWORD}@db:5432/valo
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${VALO_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
